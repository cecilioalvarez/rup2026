<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listado de cursos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h2 mb-0">Listado de cursos</h1>
			<a class="btn btn-primary" th:href="@{/cursos/nuevo}" href="formulario.html">Nuevo curso</a>
		</div>

		<form class="row g-2 align-items-center mb-4" method="get" th:action="@{/cursos}">
			<div class="col-sm-auto">
				<label class="visually-hidden" for="campo">Buscar por</label>
				<select class="form-select" id="campo" name="campo">
					<option value="titulo" th:selected="${campo == 'titulo'}">Título</option>
					<option value="autor" th:selected="${campo == 'autor'}">Autor</option>
					<option value="nivel" th:selected="${campo == 'nivel'}">Nivel</option>
				</select>
			</div>
			<div class="col-sm">
				<label class="visually-hidden" for="texto">Texto a buscar</label>
				<input class="form-control" type="search" id="texto" name="texto" th:value="${texto}"
					placeholder="Empieza por...">
			</div>
			<div class="col-sm-auto d-flex gap-2">
				<button class="btn btn-outline-primary" type="submit">Buscar</button>
				<a class="btn btn-outline-secondary" th:href="@{/cursos}" th:if="${not #strings.isEmpty(texto)}"
					href="listado.html">Limpiar</a>
			</div>
		</form>

		<div class="table-responsive" th:if="${not #lists.isEmpty(cursos)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>Id</th>
						<th>Título</th>
						<th>Autor</th>
						<th>Duración (horas)</th>
						<th>Nivel</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="curso : ${cursos}">
						<td th:text="${curso.id}">1</td>
						<td th:text="${curso.titulo}">Java</td>
						<td th:text="${curso.autor}">Autor</td>
						<td th:text="${curso.duracion}">10</td>
						<td th:text="${curso.nivel}">Básico</td>
						<td class="text-end">
							<a class="btn btn-sm btn-outline-secondary"
								th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}"
								href="../imparticiones/listado.html">Imparticiones</a>
							<a class="btn btn-sm btn-outline-primary" th:href="@{/cursos/{id}/editar(id=${curso.id})}"
								href="formulario.html">Editar</a>
							<form class="d-inline" method="post" th:action="@{/cursos/{id}/borrar(id=${curso.id})}"
								onsubmit="return confirm('¿Seguro que quieres borrar este curso?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(cursos)}"
			th:text="${#strings.isEmpty(texto)} ? 'No hay cursos disponibles.' : 'No hay cursos que coincidan con la búsqueda.'">
			No hay cursos disponibles.</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
