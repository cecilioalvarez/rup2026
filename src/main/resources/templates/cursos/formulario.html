<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${idCurso == null} ? 'Nuevo curso' : 'Editar curso'">Nuevo curso</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('cursos')}"></nav>

	<div class="container py-4">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body">
						<h1 class="h3 card-title mb-4" th:text="${idCurso == null} ? 'Nuevo curso' : 'Editar curso'">Nuevo curso</h1>

						<form th:action="${idCurso == null} ? @{/cursos} : @{/cursos/{id}(id=${idCurso})}"
							th:object="${curso}" method="post">
							<div class="mb-3">
								<label class="form-label" for="titulo">Título</label>
								<input class="form-control" type="text" th:field="*{titulo}" required>
							</div>
							<div class="mb-3">
								<label class="form-label" for="autor">Autor</label>
								<input class="form-control" type="text" th:field="*{autor}" required>
							</div>
							<div class="mb-3">
								<label class="form-label" for="duracion">Duración (horas)</label>
								<input class="form-control" type="number" th:field="*{duracion}" min="1" max="200" required
									th:errorclass="is-invalid">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('duracion')}" th:errors="*{duracion}">Error</div>
							</div>
							<div class="mb-4">
								<label class="form-label" for="idNivel">Nivel</label>
								<select class="form-select" th:field="*{idNivel}" required>
									<option value="">-- Selecciona --</option>
									<option th:each="n : ${niveles}" th:value="${n.id}" th:text="${n.nombre}">Básico</option>
								</select>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-primary" type="submit">Guardar</button>
								<a class="btn btn-outline-secondary" th:href="@{/cursos}" href="listado.html">Volver al listado</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
