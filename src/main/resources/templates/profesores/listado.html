<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listado de profesores</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('profesores')}"></nav>

	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h2 mb-0">Listado de profesores</h1>
			<a class="btn btn-primary" th:href="@{/profesores/nuevo}" href="formulario.html">Nuevo profesor</a>
		</div>

		<form class="row g-2 mb-4" method="get" th:action="@{/profesores}" role="search">
			<div class="col-sm-3">
				<label class="visually-hidden" for="campo">Buscar por</label>
				<select class="form-select" id="campo" name="campo">
					<option th:each="c : ${campos}" th:value="${c}" th:text="${c.etiqueta}"
						th:selected="${c == campo}">Nombre</option>
				</select>
			</div>
			<div class="col-sm">
				<label class="visually-hidden" for="texto">Texto a buscar</label>
				<input class="form-control" type="search" id="texto" name="texto" th:value="${texto}"
					placeholder="Texto a buscar">
			</div>
			<div class="col-sm-auto">
				<button class="btn btn-outline-primary" type="submit">Buscar</button>
				<a class="btn btn-outline-secondary" th:href="@{/profesores}" th:if="${not #strings.isEmpty(texto)}"
					href="listado.html">Limpiar</a>
			</div>
		</form>

		<div class="table-responsive" th:if="${not #lists.isEmpty(profesores)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>DNI</th>
						<th>Nombre</th>
						<th>Apellidos</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="profesor : ${profesores}">
						<td th:text="${profesor.dni}">12345678Z</td>
						<td th:text="${profesor.nombre}">Nombre</td>
						<td th:text="${profesor.apellidos}">Apellidos</td>
						<td class="text-end">
							<a class="btn btn-sm btn-outline-primary"
								th:href="@{/profesores/{id}/editar(id=${profesor.id})}" href="formulario.html">Editar</a>
							<form class="d-inline" method="post" th:action="@{/profesores/{id}/borrar(id=${profesor.id})}"
								onsubmit="return confirm('¿Seguro que quieres borrar este profesor?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(profesores)}"
			th:text="${#strings.isEmpty(texto)} ? 'No hay profesores disponibles.' : 'No hay profesores que coincidan con la búsqueda.'">
			No hay profesores disponibles.</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
