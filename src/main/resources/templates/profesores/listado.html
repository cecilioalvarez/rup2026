<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listado de profesores</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h2 mb-0">Listado de profesores</h1>
			<a class="btn btn-primary" th:href="@{/profesores/nuevo}" href="formulario.html">Nuevo profesor</a>
		</div>

		<div class="table-responsive" th:if="${not #lists.isEmpty(profesores)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>DNI</th>
						<th>Nombre</th>
						<th>Apellidos</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="profesor : ${profesores}">
						<td th:text="${profesor.dni}">12345678Z</td>
						<td th:text="${profesor.nombre}">Nombre</td>
						<td th:text="${profesor.apellidos}">Apellidos</td>
						<td class="text-end">
							<a class="btn btn-sm btn-outline-primary"
								th:href="@{/profesores/{id}/editar(id=${profesor.id})}" href="formulario.html">Editar</a>
							<form class="d-inline" method="post" th:action="@{/profesores/{id}/borrar(id=${profesor.id})}"
								onsubmit="return confirm('¿Seguro que quieres borrar este profesor?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(profesores)}">No hay profesores disponibles.</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
