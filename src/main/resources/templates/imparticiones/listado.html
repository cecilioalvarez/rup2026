<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Imparticiones de ' + ${curso.titulo}">Imparticiones</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<div class="container py-4">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/cursos}" href="../cursos/listado.html">Cursos</a></li>
				<li class="breadcrumb-item active" aria-current="page" th:text="${curso.titulo}">Java</li>
			</ol>
		</nav>

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h2 mb-0">Imparticiones de <span th:text="${curso.titulo}">Java</span></h1>
			<div class="d-flex gap-2">
				<a class="btn btn-primary" th:href="@{/cursos/{id}/imparticiones/nueva(id=${curso.id})}"
					href="formulario.html">Nueva impartición</a>
				<a class="btn btn-outline-secondary" th:href="@{/cursos}" href="../cursos/listado.html">Volver a cursos</a>
			</div>
		</div>

		<div class="table-responsive" th:if="${not #lists.isEmpty(imparticiones)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>Id</th>
						<th>Nombre</th>
						<th>Fecha de inicio</th>
						<th>Fecha de fin</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="imparticion : ${imparticiones}">
						<td th:text="${imparticion.id}">1</td>
						<td th:text="${imparticion.nombre}">Java - Enero</td>
						<td th:text="${#temporals.format(imparticion.fechaInicio, 'dd/MM/yyyy')}">12/01/2026</td>
						<td th:text="${#temporals.format(imparticion.fechaFin, 'dd/MM/yyyy')}">23/01/2026</td>
						<td class="text-end">
							<a class="btn btn-sm btn-outline-primary"
								th:href="@{/cursos/{id}/imparticiones/{idImparticion}/editar(id=${curso.id},idImparticion=${imparticion.id})}"
								href="formulario.html">Editar</a>
							<form class="d-inline" method="post"
								th:action="@{/cursos/{id}/imparticiones/{idImparticion}/borrar(id=${curso.id},idImparticion=${imparticion.id})}"
								onsubmit="return confirm('¿Seguro que quieres borrar esta impartición?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(imparticiones)}">
			Este curso no tiene imparticiones.
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
