<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${idImparticion == null} ? 'Nueva impartición' : 'Editar impartición'">Nueva impartición</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('cursos')}"></nav>

	<div class="container py-4">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/cursos}" href="../cursos/listado.html">Cursos</a></li>
				<li class="breadcrumb-item"><a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}"
					th:text="${curso.titulo}" href="listado.html">Java</a></li>
				<li class="breadcrumb-item active" aria-current="page"
					th:text="${idImparticion == null} ? 'Nueva impartición' : 'Editar impartición'">Nueva impartición</li>
			</ol>
		</nav>

		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body">
						<h1 class="h3 card-title mb-1"
							th:text="${idImparticion == null} ? 'Nueva impartición' : 'Editar impartición'">Nueva impartición</h1>
						<p class="text-body-secondary mb-4" th:text="${curso.titulo}">Java</p>

						<form th:action="${idImparticion == null}
								? @{/cursos/{id}/imparticiones(id=${curso.id})}
								: @{/cursos/{id}/imparticiones/{idImparticion}(id=${curso.id},idImparticion=${idImparticion})}"
							th:object="${imparticion}" method="post">
							<div class="mb-3">
								<label class="form-label" for="nombre">Nombre</label>
								<input class="form-control" type="text" th:field="*{nombre}" required
									th:errorclass="is-invalid">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
							</div>
							<div class="row">
								<div class="col-sm-6 mb-3">
									<label class="form-label" for="fechaInicio">Fecha de inicio</label>
									<input class="form-control" type="date" th:field="*{fechaInicio}" required
										th:errorclass="is-invalid">
									<div class="invalid-feedback" th:if="${#fields.hasErrors('fechaInicio')}"
										th:errors="*{fechaInicio}">Error</div>
								</div>
								<div class="col-sm-6 mb-4">
									<label class="form-label" for="fechaFin">Fecha de fin</label>
									<input class="form-control" type="date" th:field="*{fechaFin}" required
										th:errorclass="is-invalid">
									<div class="invalid-feedback" th:if="${#fields.hasErrors('fechaFin')}"
										th:errors="*{fechaFin}">Error</div>
								</div>
							</div>
							<div class="mb-4">
								<label class="form-label" for="idProfesor">Profesor</label>
								<select class="form-select" th:field="*{idProfesor}" required th:errorclass="is-invalid">
									<option value="">-- Selecciona --</option>
									<option th:each="p : ${profesores}" th:value="${p.id}"
										th:text="${p.nombre + ' ' + p.apellidos}">Laura Martín García</option>
								</select>
								<div class="invalid-feedback" th:if="${#fields.hasErrors('idProfesor')}"
									th:errors="*{idProfesor}">Error</div>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-primary" type="submit">Guardar</button>
								<a class="btn btn-outline-secondary" th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}"
									href="listado.html">Volver a imparticiones</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
