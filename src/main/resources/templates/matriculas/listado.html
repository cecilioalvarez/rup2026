<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Matrículas de ' + ${imparticion.nombre}">Matrículas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('cursos')}"></nav>

	<div class="container py-4">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/cursos}" href="../cursos/listado.html">Cursos</a></li>
				<li class="breadcrumb-item"><a th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}"
					th:text="${curso.titulo}" href="../imparticiones/listado.html">Java</a></li>
				<li class="breadcrumb-item active" aria-current="page" th:text="${imparticion.nombre}">Java - Enero</li>
			</ol>
		</nav>

		<div class="d-flex justify-content-between align-items-center mb-1">
			<h1 class="h2 mb-0">Matrículas de <span th:text="${imparticion.nombre}">Java - Enero</span></h1>
			<a class="btn btn-outline-secondary" th:href="@{/cursos/{id}/imparticiones(id=${curso.id})}"
				href="../imparticiones/listado.html">Volver a imparticiones</a>
		</div>
		<p class="text-body-secondary mb-4">
			Profesor: <span th:text="${imparticion.profesor}">Laura Martín García</span> ·
			<span th:text="${#temporals.format(imparticion.fechaInicio, 'dd/MM/yyyy')}">12/01/2026</span> -
			<span th:text="${#temporals.format(imparticion.fechaFin, 'dd/MM/yyyy')}">23/01/2026</span>
		</p>

		<div class="card shadow-sm mb-4">
			<div class="card-body">
				<h2 class="h5 card-title mb-3">Nueva matrícula</h2>
				<form class="row g-2 align-items-start" method="post"
					th:action="@{/cursos/{id}/imparticiones/{idImparticion}/matriculas(id=${curso.id},idImparticion=${imparticion.id})}"
					th:object="${matricula}">
					<div class="col-md">
						<label class="visually-hidden" for="idAlumno">Alumno</label>
						<select class="form-select" th:field="*{idAlumno}" required th:errorclass="is-invalid">
							<option value="">-- Selecciona un alumno --</option>
							<option th:each="a : ${alumnos}" th:value="${a.id}"
								th:text="${a.nombre + ' ' + a.apellidos + ' (' + a.dni + ')'}">Carlos Díaz Romero (11223344B)</option>
						</select>
						<div class="invalid-feedback" th:if="${#fields.hasErrors('idAlumno')}" th:errors="*{idAlumno}">Error</div>
					</div>
					<div class="col-md-3">
						<label class="visually-hidden" for="fecha">Fecha</label>
						<input class="form-control" type="date" th:field="*{fecha}" required th:errorclass="is-invalid">
						<div class="invalid-feedback" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}">Error</div>
					</div>
					<div class="col-md-auto">
						<button class="btn btn-primary" type="submit">Matricular</button>
					</div>
				</form>
			</div>
		</div>

		<div class="table-responsive" th:if="${not #lists.isEmpty(matriculas)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>Id</th>
						<th>Alumno</th>
						<th>Fecha de matrícula</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="m : ${matriculas}">
						<td th:text="${m.id}">1</td>
						<td th:text="${m.alumno}">Carlos Díaz Romero</td>
						<td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy')}">05/01/2026</td>
						<td class="text-end">
							<form class="d-inline" method="post"
								th:action="@{/cursos/{id}/imparticiones/{idImparticion}/matriculas/{idMatricula}/borrar(id=${curso.id},idImparticion=${imparticion.id},idMatricula=${m.id})}"
								onsubmit="return confirm('¿Seguro que quieres borrar esta matrícula?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(matriculas)}">
			Esta impartición no tiene matrículas.
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
