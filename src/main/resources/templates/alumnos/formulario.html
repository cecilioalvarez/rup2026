<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${idAlumno == null} ? 'Nuevo alumno' : 'Editar alumno'">Nuevo alumno</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('alumnos')}"></nav>

	<div class="container py-4">
		<div class="row justify-content-center">
			<div class="col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body">
						<h1 class="h3 card-title mb-4" th:text="${idAlumno == null} ? 'Nuevo alumno' : 'Editar alumno'">Nuevo alumno</h1>

						<form th:action="${idAlumno == null} ? @{/alumnos} : @{/alumnos/{id}(id=${idAlumno})}"
							th:object="${alumno}" method="post">
							<div class="mb-3">
								<label class="form-label" for="dni">DNI</label>
								<input class="form-control" type="text" th:field="*{dni}" maxlength="9" required
									th:errorclass="is-invalid">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}">Error</div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="nombre">Nombre</label>
								<input class="form-control" type="text" th:field="*{nombre}" required
									th:errorclass="is-invalid">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Error</div>
							</div>
							<div class="mb-3">
								<label class="form-label" for="apellidos">Apellidos</label>
								<input class="form-control" type="text" th:field="*{apellidos}" required
									th:errorclass="is-invalid">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}">Error</div>
							</div>
							<div class="mb-4">
								<label class="form-label" for="email">Email</label>
								<input class="form-control" type="email" th:field="*{email}" required
									th:errorclass="is-invalid">
								<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
							</div>
							<div class="d-flex gap-2">
								<button class="btn btn-primary" type="submit">Guardar</button>
								<a class="btn btn-outline-secondary" th:href="@{/alumnos}" href="listado.html">Volver al listado</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
