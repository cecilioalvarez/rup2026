<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listado de alumnos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('alumnos')}"></nav>

	<div class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h2 mb-0">Listado de alumnos</h1>
			<a class="btn btn-primary" th:href="@{/alumnos/nuevo}" href="formulario.html">Nuevo alumno</a>
		</div>

		<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}">Error al borrar</div>

		<div class="table-responsive" th:if="${not #lists.isEmpty(alumnos)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>DNI</th>
						<th>Nombre</th>
						<th>Apellidos</th>
						<th>Email</th>
						<th class="text-end">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="alumno : ${alumnos}">
						<td th:text="${alumno.dni}">12345678Z</td>
						<td th:text="${alumno.nombre}">Nombre</td>
						<td th:text="${alumno.apellidos}">Apellidos</td>
						<td th:text="${alumno.email}">alumno@example.com</td>
						<td class="text-end">
							<a class="btn btn-sm btn-outline-secondary"
								th:href="@{/alumnos/{id}/matriculas(id=${alumno.id})}" href="matriculas.html">Matrículas</a>
							<a class="btn btn-sm btn-outline-primary"
								th:href="@{/alumnos/{id}/editar(id=${alumno.id})}" href="formulario.html">Editar</a>
							<form class="d-inline" method="post" th:action="@{/alumnos/{id}/borrar(id=${alumno.id})}"
								onsubmit="return confirm('¿Seguro que quieres borrar este alumno?');">
								<button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(alumnos)}">No hay alumnos disponibles.</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
