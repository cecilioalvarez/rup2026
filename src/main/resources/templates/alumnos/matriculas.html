<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'Matrículas de ' + ${alumno.nombre} + ' ' + ${alumno.apellidos}">Matrículas del alumno</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
	<nav th:replace="~{fragmentos/menu :: menu('alumnos')}"></nav>

	<div class="container py-4">
		<nav aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a th:href="@{/alumnos}" href="listado.html">Alumnos</a></li>
				<li class="breadcrumb-item active" aria-current="page"
					th:text="${alumno.nombre + ' ' + alumno.apellidos}">Carlos Díaz Romero</li>
			</ol>
		</nav>

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h1 class="h2 mb-0">Matrículas de <span th:text="${alumno.nombre + ' ' + alumno.apellidos}">Carlos Díaz Romero</span></h1>
			<a class="btn btn-outline-secondary" th:href="@{/alumnos}" href="listado.html">Volver a alumnos</a>
		</div>

		<div class="table-responsive" th:if="${not #lists.isEmpty(matriculas)}">
			<table class="table table-striped table-hover align-middle">
				<thead class="table-light">
					<tr>
						<th>Curso</th>
						<th>Impartición</th>
						<th>Fecha de matrícula</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="m : ${matriculas}">
						<td th:text="${m.curso}">Java Básico</td>
						<td><a th:href="@{/cursos/{id}/imparticiones/{idImparticion}/matriculas(id=${m.idCurso},idImparticion=${m.idImparticion})}"
							th:text="${m.imparticion}" href="../matriculas/listado.html">Java Básico - Enero</a></td>
						<td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy')}">05/01/2026</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="alert alert-info" th:if="${#lists.isEmpty(matriculas)}">
			Este alumno no tiene matrículas. Se matricula desde la impartición de un curso.
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
